<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#0E7C66;
    --ink:#1B1F1E;
    --ink-soft:#4A5250;
    --paper:#F7F5F0;
    --sand:#E9E2D3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{
    background:radial-gradient(120% 100% at 50% 42%, #FBF9F5 0%, var(--paper) 45%, var(--sand) 100%);
    display:flex;align-items:center;justify-content:center;
    font-kerning:normal;
    -webkit-font-smoothing:antialiased;
  }
  .card{text-align:center;transform:translateY(-14px)}
  .rule{
    width:56px;height:4px;border-radius:2px;
    background:var(--accent);margin:0 auto 40px;
  }
  .logo{
    font-family:'Fraunces',Georgia,serif;
    font-weight:800;
    font-size:104px;
    letter-spacing:-0.02em;
    line-height:1;
    color:var(--ink);
  }
  .logo em{font-style:normal;color:var(--accent)}
  .tagline{
    font-family:'Archivo',system-ui,sans-serif;
    font-weight:500;
    font-size:30px;
    letter-spacing:0.01em;
    color:var(--ink-soft);
    margin-top:26px;
  }
  .meta{
    font-family:'Archivo',system-ui,sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin-top:38px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rule"></div>
    <div class="logo">The<em>Cutroom</em></div>
    <div class="tagline">You shoot it. We finish it.</div>
    <div class="meta">Video Editing Studio &middot; Kingston, JA</div>
  </div>
</body>
</html>
